[package]
name = "radiopittray"
version = "0.1.2"
edition = "2021"
description = "System tray radio player for your RadioPit.fm library"
license = "GPL-3.0"

[dependencies]
anyhow = "1"
dirs = "5"
eframe = "0.29"
egui = "0.29"
gstreamer = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
# `images` zou de default-features (rayon, alle formaten) van `image`
# aanzetten; de lichte variant volstaat, want `image` boven levert al
# png/jpeg/webp. `async` is nodig: de sync `show()` roept zbus' `block_on`
# aan, wat panict als het vanuit een tokio-taak komt.
notify-rust = { version = "4", features = ["images_no_default_features", "async"] }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# default-features uit: `libxdo` (xdotool-achtige key sequences voor de
# vooraf gedefinieerde Copy/Cut/Paste items) gebruiken we niet.
tray-icon = { version = "0.19", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
gtk = "0.18"

[profile.release]
lto = true
strip = true
